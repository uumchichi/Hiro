name: Deploy

# main 브랜치에 올라가면: 검사 → DB 마이그레이션 → 서버 함수 → 화면(GitHub Pages) 순서로 배포해요.
# Actions 탭에서 'Run workflow'로 직접 실행할 수도 있어요.
#
# 저장소 Settings → Secrets and variables → Actions 에 필요한 값
#   Secrets:   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#   Variables: SUPABASE_PROJECT_REF, SUPABASE_URL, SUPABASE_ANON_KEY
# Settings → Pages 의 Source는 'GitHub Actions' 로 두세요.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # 배포 도중에 끊기지 않게, 새 배포는 기다렸다가 해요

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  supabase:
    needs: check
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::$v 가 비어 있어요. 저장소 Settings → Secrets and variables → Actions 를 확인하세요."; exit 1; fi
          done
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"
      # 이미 SQL Editor로 적용한 마이그레이션도 안전해요 (여러 번 적용해도 같은 결과가 되게 만들었어요)
      - name: Apply database migrations
        # DB 비밀번호는 환경변수 SUPABASE_DB_PASSWORD로 전달돼요. --linked: 위에서 연결한 Supabase 프로젝트에 적용
        run: supabase db push --linked --include-all
      - name: Deploy Edge Function (api)
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt

  pages:
    needs: supabase
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "::error::SUPABASE_URL, SUPABASE_ANON_KEY (Variables)를 넣어 주세요."; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build:static
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.SUPABASE_URL }}/functions/v1/api
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
